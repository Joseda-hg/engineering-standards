# Descriptive only: no tool reads this file. The switches below select the profile.
profile = "strict"
description = "Warnings are errors and the guard rails are enforced. Use for new code and for projects that are clean."
verified_by = "all negative fixtures run under strict"

[csharp]
switch = "<EngineeringStandardsProfile>strict</EngineeringStandardsProfile>"
nullable = "enable"
analysis_level = "latest-all"
treat_warnings_as_errors = true
guards = "ESTD001-ESTD005"

[rust]
switch = "scripts/quality.sh rust PATH (default; clippy -D warnings)"
lints = "rust/workspace-lints.toml, warnings denied"
