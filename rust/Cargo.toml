# Self-test workspace for the Rust standards.
# Negative fixtures are members (so they inherit the shipped lints) but not default members:
# `cargo check` / `cargo test` / `cargo clippy` without -p only cover the positive fixtures.
[workspace]
resolver = "3"
members = ["fixtures/positive/*", "fixtures/negative/*"]
default-members = ["fixtures/positive/inventory"]
exclude = [
  "fixtures/negative/fmt-001-unformatted",
  "fixtures/negative/sup-001-scan-lints-not-inherited",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Everything below must stay identical to workspace-lints.toml (checked by scripts/verify-fixtures.sh).

[workspace.lints.rust]
# SAFE-001: exceptions use #[expect(unsafe_code, reason = "...")] plus a `// SAFETY:` comment.
unsafe_code = "warn"
# ERR-001 / ASY-001: ignored Result values and un-awaited futures.
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# ERR-001: no unwrap/expect in production paths (allowed in tests via clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
# API-001: paths configured in clippy.toml.
disallowed_methods = "warn"
# STATE-001: a wildcard arm on an enum hides newly added variants.
wildcard_enum_match_arm = "warn"
# SAFE-001: every sanctioned unsafe block needs a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
# SUP-001: suppressions use #[expect] (which fails once unnecessary) and must state a reason.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
