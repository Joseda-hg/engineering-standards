# Engineering Standards - Clippy configuration. Copy to the consuming workspace root.
# Every disallowed path is exercised by a negative fixture under rust/fixtures/negative/.

# ERR-001: unwrap/expect are acceptable in tests.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "API-001: inject a clock; read the wall clock only in one sanctioned adapter" },
]
